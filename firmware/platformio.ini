; RS485 / Modbus RTU bench tool for the HSY pH+EC controller.
; Target: Waveshare ESP32-S3-Relay-1CH (ESP32-S3-WROOM-1U, 16 MB flash).
;
; RS485 pin map comes from the Waveshare factory demo (WS_GPIO.h):
;   TXD1 = GPIO17, RXD1 = GPIO18, TXD1EN = GPIO21.

[env:esp32-s3-relay-1ch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.wait_for_upload_port = false
monitor_dtr = 0
monitor_rts = 0

; Native USB CDC (hardware CDC + JTAG, same mode as the factory firmware).
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D BENCH_PIN_RS485_TX=17
	-D BENCH_PIN_RS485_RX=18
	-D BENCH_PIN_RS485_DE=21
